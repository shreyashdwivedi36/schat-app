<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 • Page Not Found — SChat™</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=162">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12), transparent 70%);
      color: var(--text-main);
      font-family: var(--font-family);
    }
    [data-theme="light"] body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, rgba(219, 234, 254, 0.7), transparent 70%);
    }
    .error-card {
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg, rgba(16, 21, 35, 0.75));
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border-specular);
      border-radius: var(--radius-squircle-xl, 28px);
      box-shadow: var(--neu-shadow-surface), var(--glass-bevel);
      padding: 44px 32px;
      text-align: center;
      box-sizing: border-box;
      animation: springIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="light"] .error-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 48px -8px rgba(15, 23, 42, 0.1), 0 4px 12px -2px rgba(15, 23, 42, 0.04), inset 0 1px 0 #ffffff;
    }
    @keyframes springIn {
      0% { opacity: 0; transform: translateY(24px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
    }
    [data-theme="light"] .error-code {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 12px 0;
      color: var(--text-main);
    }
    [data-theme="light"] .error-title {
      color: #0f172a;
    }
    .error-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 0 28px 0;
    }
    [data-theme="light"] .error-desc {
      color: #475569;
    }
    .error-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }
    .error-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.45);
    }
    .error-action-btn:active {
      transform: scale(0.97);
    }
    .brand-mini-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    [data-theme="light"] .brand-mini-badge {
      background: rgba(0, 0, 0, 0.04);
      color: #334155;
    }
    .brand-mini-badge img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
  </style>
  <script>
    // Theme synchronization
    try {
      const savedTheme = localStorage.getItem('schat_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="error-card">
    <div class="brand-mini-badge">
      <img src="logo.png" alt="SChat Logo">
      <span>SChat™ Realtime Mesh</span>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Lost in the Mesh</h1>
    <p class="error-desc">
      The page, room, or endpoint you are trying to reach does not exist, has expired, or has been relocated.
    </p>
    <a href="/" class="error-action-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Return to Safety / Home Hub</span>
    </a>
  </div>
</body>
</html>
