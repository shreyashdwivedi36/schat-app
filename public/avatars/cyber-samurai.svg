<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSamurai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#030014"/>
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bgSamurai)"/>
  <!-- Ambient Neon Rim -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#neonPink)" stroke-width="3" opacity="0.4" filter="url(#neonGlow)"/>
  <!-- Samurai Crest (Kabuto Horns) -->
  <path d="M 60 45 Q 100 20 100 65 Q 100 20 140 45 Q 115 55 100 75 Q 85 55 60 45 Z" fill="url(#neonPink)" filter="url(#neonGlow)"/>
  <!-- Helmet (Kabuto Base) -->
  <path d="M 50 85 Q 100 50 150 85 L 155 115 Q 100 135 45 115 Z" fill="url(#armorGrad)" stroke="#3b0764" stroke-width="2"/>
  <!-- Cyber Oni Face Mask (Menpo) -->
  <path d="M 65 105 L 100 145 L 135 105 L 128 150 L 100 165 L 72 150 Z" fill="#0f0728" stroke="url(#neonPink)" stroke-width="2"/>
  <!-- Glowing Cyber Eyes (Visor) -->
  <polygon points="72,102 92,105 88,112 68,108" fill="#38bdf8" filter="url(#neonGlow)"/>
  <polygon points="128,102 108,105 112,112 132,108" fill="#38bdf8" filter="url(#neonGlow)"/>
  <!-- Fang Detailing -->
  <polygon points="85,130 92,130 88,140" fill="#f43f5e"/>
  <polygon points="115,130 108,130 112,140" fill="#f43f5e"/>
  <!-- Neck / Shoulder Armor (Sode) -->
  <path d="M 40 160 Q 100 145 160 160 L 175 200 L 25 200 Z" fill="url(#armorGrad)" stroke="url(#neonPink)" stroke-width="2"/>
  <line x1="100" y1="160" x2="100" y2="200" stroke="#f43f5e" stroke-width="3" filter="url(#neonGlow)"/>
</svg>